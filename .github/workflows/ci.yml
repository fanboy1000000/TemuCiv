name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Jobs are deliberately independent (no `needs:`): one red job must never hide another.
# Third-party actions are pinned to full commit SHAs (immutable), with the tag they came from in a comment.
jobs:
  checks:
    name: npm run ci (docs, secret scan, governance tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run every project check
        run: node tools/ci.mjs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}\$" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan the full history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 .
