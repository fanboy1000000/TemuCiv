name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Jobs are deliberately independent (no `needs:`): one red job must never hide another.
jobs:
  checks:
    name: npm run ci (docs consistency + hook tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every project check
        run: node tools/ci.mjs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan the full history for secrets
        run: gitleaks git --redact --verbose --exit-code 1 .
